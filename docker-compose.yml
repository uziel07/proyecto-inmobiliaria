services:
  db:
    image: postgres:15-alpine
    container_name: postgres_inmobiliaria
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_segura
      POSTGRES_DB: inmobiliaria_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d inmobiliaria_db']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:tu_password_segura@db:5432/inmobiliaria_db
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    volumes: ['./backend:/app']
volumes:
  pgdata:
