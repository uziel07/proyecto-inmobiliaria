<div class="mt-16 rounded-2xl border border-slate-200 bg-white p-6 md:p-8"><div class="mb-7 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><div class="mb-3 text-[10px] font-bold tracking-widest text-slate-500">05 / CLIENTES</div><h3 class="font-serif text-3xl text-slate-900">Registrar un cliente</h3></div><p class="max-w-sm text-xs leading-relaxed text-slate-500">Datos de contacto de inversores y compradores potenciales conectados con PostgreSQL.</p></div><form class="grid grid-cols-1 gap-4 md:grid-cols-2" [formGroup]="form" (ngSubmit)="guardar()"><label class="grid gap-2 text-xs text-slate-500">Nombre completo<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="nombre" placeholder="Nombre y apellido"></label><label class="grid gap-2 text-xs text-slate-500">Email<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" type="email" formControlName="email" placeholder="correo@ejemplo.com"></label><label class="grid gap-2 text-xs text-slate-500">Documento (DNI/RUC)<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="documento" placeholder="Ej. 12345678"></label><label class="grid gap-2 text-xs text-slate-500">Teléfono<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="telefono" placeholder="+51 999 999 999"></label><button class="rounded-full bg-slate-900 px-5 py-3 text-xs text-white disabled:opacity-50 md:col-span-2" type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Registrar cliente' }}</button></form>@if (mensaje()) {<p class="mt-4 text-xs text-emerald-700">{{ mensaje() }}</p>} @if (error()) {<p class="mt-4 text-xs text-rose-700">{{ error() }}</p>}</div>
