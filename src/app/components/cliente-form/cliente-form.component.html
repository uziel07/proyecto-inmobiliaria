<div class="cliente-form"><div class="form-heading"><div><div class="section-label">05 / CLIENTES</div><h3>Registrar un cliente</h3></div><p>Datos de contacto de inversores y compradores potenciales conectados con PostgreSQL.</p></div><form [formGroup]="form" (ngSubmit)="guardar()"><label>Nombre completo<input formControlName="nombre" placeholder="Nombre y apellido"></label><label>Email<input type="email" formControlName="email" placeholder="correo@ejemplo.com"></label><label>Documento (DNI/RUC)<input formControlName="documento" placeholder="Ej. 12345678"></label><label>Teléfono<input formControlName="telefono" placeholder="+51 999 999 999"></label><button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Registrar cliente' }}</button></form>@if (mensaje()) {<p class="success">{{ mensaje() }}</p>} @if (error()) {<p class="form-error">{{ error() }}</p>}</div>
