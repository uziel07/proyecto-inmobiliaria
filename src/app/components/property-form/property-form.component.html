<div class="mt-16 rounded-2xl border border-slate-200 bg-white p-6 md:p-8"><div class="mb-7 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><div class="mb-3 text-[10px] font-bold tracking-widest text-slate-500">04 / NUEVO ACTIVO</div><h3 class="font-serif text-3xl text-slate-900">Registrar una propiedad</h3></div><p class="max-w-sm text-xs leading-relaxed text-slate-500">Agrega oportunidades directamente al catálogo conectado con PostgreSQL.</p></div><form class="grid grid-cols-1 gap-4 md:grid-cols-2" [formGroup]="form" (ngSubmit)="guardar()"><label class="grid gap-2 text-xs text-slate-500">Categoría<select class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="categoria_id"><option value="">Selecciona una categoría</option>@for (categoria of categorias(); track categoria.id) {<option [value]="categoria.id">{{ categoria.nombre }}</option>}</select></label><label class="grid gap-2 text-xs text-slate-500 md:col-span-2">Nombre<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="nombre" placeholder="Nombre de la propiedad"></label><label class="grid gap-2 text-xs text-slate-500 md:col-span-2">Descripción<textarea class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="descripcion" rows="3" placeholder="Describe el potencial de inversión"></textarea></label><label class="grid gap-2 text-xs text-slate-500 md:col-span-2">Ubicación<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="ubicacion" placeholder="Distrito, ciudad"></label><label class="grid gap-2 text-xs text-slate-500">SKU<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="sku" placeholder="PROP-NUEVA-001"></label><label class="grid gap-2 text-xs text-slate-500">Precio<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" type="number" formControlName="precio" min="0"></label><label class="grid gap-2 text-xs text-slate-500">Rentabilidad (%)<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" type="number" formControlName="rentabilidad_estimada" min="0" max="100" step="0.01"></label><label class="grid gap-2 text-xs text-slate-500">Stock<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" type="number" formControlName="stock" min="0"></label><label class="grid gap-2 text-xs text-slate-500">Imagen<input class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="imagen_url" placeholder="/images/properties/property-placeholder.svg"></label><label class="grid gap-2 text-xs text-slate-500">Estado<select class="rounded-lg border border-slate-200 bg-paper px-3 py-3 text-xs outline-none" formControlName="estado">@for (estado of estados; track estado) {<option [value]="estado">{{ estado.replace('_', ' ') }}</option>}</select></label><label class="flex items-center gap-2 text-xs text-slate-500"><input type="checkbox" formControlName="activo"> Activo</label><button class="rounded-full bg-slate-900 px-5 py-3 text-xs text-white disabled:opacity-50 md:col-span-2" type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Registrar propiedad' }}</button></form>@if (mensaje()) {<p class="mt-4 text-xs text-emerald-700">{{ mensaje() }}</p>} @if (error()) {<p class="mt-4 text-xs text-rose-700">{{ error() }}</p>}</div>
