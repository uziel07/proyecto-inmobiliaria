<div class="property-form"><div class="form-heading"><div><div class="section-label">04 / NUEVO ACTIVO</div><h3>Registrar una propiedad</h3></div><p>Agrega oportunidades directamente al catálogo conectado con PostgreSQL.</p></div><form [formGroup]="form" (ngSubmit)="guardar()"><label>Categoría<select formControlName="categoria_id"><option value="">Selecciona una categoría</option>@for (categoria of categorias(); track categoria.id) {<option [value]="categoria.id">{{ categoria.nombre }}</option>}</select></label><label>Nombre<input formControlName="nombre" placeholder="Nombre de la propiedad"></label><label>Descripción<textarea formControlName="descripcion" rows="3" placeholder="Describe el potencial de inversión"></textarea></label><label>Ubicación<input formControlName="ubicacion" placeholder="Distrito, ciudad"></label><label>SKU<input formControlName="sku" placeholder="PROP-NUEVA-001"></label><label>Precio<input type="number" formControlName="precio" min="0"></label><label>Rentabilidad (%)<input type="number" formControlName="rentabilidad_estimada" min="0" max="100" step="0.01"></label><label>Stock<input type="number" formControlName="stock" min="0"></label><label>Imagen<input formControlName="imagen_url" placeholder="/images/properties/property-placeholder.svg"></label><label>Estado<select formControlName="estado">@for (estado of estados; track estado) {<option [value]="estado">{{ estado.replace('_', ' ') }}</option>}</select></label><label class="active"><input type="checkbox" formControlName="activo"> Activo</label><button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Registrar propiedad' }}</button></form>@if (mensaje()) {<p class="success">{{ mensaje() }}</p>} @if (error()) {<p class="form-error">{{ error() }}</p>}</div>
